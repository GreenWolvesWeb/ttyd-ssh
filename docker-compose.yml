services:
  ttyd:
    build: .
    image: ttyd-ssh:latest
    restart: unless-stopped
    mem_limit: 64m   # local runs only; on Miget the limit comes from compose.miget.yaml
    environment:
      SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}   # PEM text or base64 of it
      SSH_KNOWN_HOSTS: ${SSH_KNOWN_HOSTS:-} # optional
    ports:
      - "5000:5000"
